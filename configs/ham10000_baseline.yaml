# HAM10000 malignant 二分类 baseline 配置（MEDFAIR 对齐）
#
# 预处理脚本: scripts/build_ham10000_splits.py
# Dataset 类:  src/datasets/ham10000_dataset.py
#
# 标签策略：malignant 二分类（Maron et al. 2019 / MEDFAIR）
#   dx ∈ {akiec, mel} -> 1（恶性）；{bcc, bkl, df, nv, vasc} -> 0（良性）
#   ⚠️ bcc 医学上为恶性，但 Maron/MEDFAIR 归入 benign，此处保留以对齐论文
#   清洗后恶性占比约 14.5%

data:
  split_dir: data/splits/ham10000        # train.csv / val.csv / test.csv
  # 图像为 images/ 下 600×450 RGB JPEG（uint8），直接 RGB 加载，无需 16-bit 处理

task:
  name: malignant_binary
  label_strategy: malignant_vs_rest      # {akiec, mel} -> 1，其余 -> 0
  positive_rate: 0.145                   # 清洗后（9948 张）恶性占比

# 敏感属性编码（MEDFAIR 对齐）：sex(2) + age_group(4 有效组) 两轴
attributes:
  sex:                  # 与 MIMIC 一致
    Male: 0
    Female: 1
    # sex == 'unknown'（57 行）已在预处理阶段排除
  age_group:            # 20 岁分箱（对齐 MEDFAIR Table A16 的 4 个有效组）
    "20-40": 0
    "40-60": 1
    "60-80": 2
    "80+": 3
    # 0-20（约 241 张，论文「too few samples」）编码为 -1；
    # sex 任务用全部 9948 张，age 任务/按年龄分组评估时过滤 age_group>=0（约 9707 张）。

# 图像变换（源图 600×450，需 resize，对齐 MEDFAIR）
# 区别于 Fitzpatrick 的「224 原生」：HAM 源图大于 224，降采样合法，故照搬 MEDFAIR 的
# Resize(256,256)→Crop(224)。皮损无解剖学左右约束，保留水平翻转（与 CXR「不翻转」相反）。
transforms:
  train:
    resize: [256, 256]
    random_crop: 224
    horizontal_flip: true
    rotation_degrees: 15
  eval:
    resize: [256, 256]
    center_crop: 224
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# 训练超参数（与 MIMIC / Fitzpatrick baseline 对齐，便于横向比较）
training:
  batch_size: 128
  num_epochs: 30
  optimizer: AdamW
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  seeds: [42, 43, 44]

# 模型
model:
  pretrained: true   # ImageNet 预训练权重 (src/models/resnet18_pretrained.py)

# 早停：监控验证集 AUC
early_stopping:
  monitor: val_auc
  mode: max
  patience: 5
  min_delta: 1.0e-4

dataloader:
  num_workers: 8
  pin_memory: true

# 重采样（敏感组 × 标签平衡）
# 默认关闭；80+ 组（n≈694）与深龄/恶性交叉子群偏少，是 WeightedRandomSampler 的试验场。
# 仅作用于 train；val/test 始终保持人群真实分布。详见 src/utils/resampling.py。
# 注：按 age_group 维度重采样前需先过滤 age_group>=0（-1 为排除组，不应参与平衡）。
resampling:
  enabled: false
  dims: [sex, age, label]   # 平衡维度：性别 × 年龄组 × 标签（src/utils/resampling.py 中 age->age_groups）
  alpha: 1.0                # 强度：0=自然分布，1=各 cell 等概率（完全平衡）
