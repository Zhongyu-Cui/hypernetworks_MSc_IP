# PAPILA 青光眼二分类 baseline 配置（MEDFAIR 对齐）
#
# 预处理脚本: scripts/build_papila_splits.py
# Dataset 类:  src/datasets/papila_dataset.py
# 方案文档:    docs/papila_preprocessing_plan.md
#
# 标签策略：青光眼二分类（排除 suspect）
#   Diagnosis==1 -> 1（青光眼）；Diagnosis==0 -> 0（非青光眼）；Diagnosis==2(suspect) 整体剔除
#   排除后 420 眼-图 / 210 患者，阳性率 20.7%（与 MEDFAIR Table A3/B.1.2 一致）

data:
  split_dir: data/splits/papila          # train.csv / val.csv / test.csv
  # 图像默认指向 data/processed/papila/fundus_256 下 256×256 RGB JPEG（预降采样缓存）；
  # 自然 RGB 加载，无需 16-bit 处理。dataset 支持 cache=True 整库常驻内存（约 82 MB）。
  cache: true

task:
  name: glaucoma_binary
  label_strategy: glaucoma_vs_nonglaucoma   # Diagnosis 1 -> 1，0 -> 0，2(suspect) 剔除
  positive_rate: 0.207                       # 排除 suspect 后（420 眼-图）青光眼占比

# 敏感属性编码（MEDFAIR 对齐）：sex(2) + age_group(2) 两轴；本数据集无种族/肤色
attributes:
  sex:                  # 与 MIMIC/HAM 一致；经青光眼率与 MEDFAIR Table A3 对齐验证
    Male: 0
    Female: 1
  age_group:            # 60 岁二分（对齐 MEDFAIR「0-60 / 60+」，边界 60 归组 0）
    "<=60": 0
    ">60": 1
    # age 是强轴：青光眼率 <=60:8.4% vs >60:29.8%（sex 弱：M24.0% / F19.0%）
  # 模型接口：属性融合模型 forward(image, sex, race) 的 race 槽位填 age_group（无种族标注）

# 图像变换（源图 2576×1934，需 resize，对齐 MEDFAIR 2D 管线）
# 与 HAM 同属「源图 >224 需降采样」一类：Resize(256,256)→Crop(224)。
# ⚠️ 眼底水平翻转会交换 OD/OS 左右外观，但视杯/视盘对青光眼判别基本左右无偏，
#    且 MEDFAIR 统一用 hflip——保留以与 MEDFAIR 可比。
transforms:
  train:
    resize: [256, 256]
    random_crop: 224
    horizontal_flip: true
    rotation_degrees: 15
  eval:
    resize: [256, 256]
    center_crop: 224
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# 训练超参数（与 MIMIC / HAM / Fitzpatrick baseline 对齐，便于横向比较）
training:
  batch_size: 64        # 数据集极小（train≈292），batch 较 HAM(128) 调小
  num_epochs: 30
  optimizer: AdamW
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  seeds: [42, 43, 44]

# 模型：ImageNet 预训练 ResNet-18
# ⚠️ PAPILA n=420 极小，不建议从零训练 PreactivResNet18；用预训练 + 强增广 + 早停防过拟合。
model:
  pretrained: true   # ImageNet 预训练权重 (src/models/resnet18_pretrained.py)

# 早停：MEDFAIR 结论——按 worst-case 子群 AUC 选模型比按 overall 更公平且几乎不损 overall。
# baseline 先用 val_auc，公平性实验切到 val_worst_group_auc 对照。
early_stopping:
  monitor: val_auc
  mode: max
  patience: 5
  min_delta: 1.0e-4

dataloader:
  num_workers: 4        # 数据小，4 足够（区别于 HAM 的 8）
  pin_memory: true

# 重采样（敏感组 × 标签平衡）
# 默认关闭；age 轴子群不均衡 + 阳性率 20.7%，是 WeightedRandomSampler 的试验场。
# 仅作用于 train；val/test 始终保持人群真实分布。
resampling:
  enabled: false
  dims: [sex, age_group, label]   # 平衡维度：性别 × 年龄组 × 标签（共 2×2×2=8 格）
  alpha: 1.0                      # 强度：0=自然分布，1=各 cell 等概率（完全平衡）

# ⚠️ 小样本警告（见 docs/papila_preprocessing_plan.md §2/§6）
# test≈84 眼 / 42 患者（本次随机划分仅 9 阳性，test 青光眼率 10.7% 偏离总体 20.7%）。
# 单次 70/10/20 指标方差极大；公平性结论与条件互信息 I(Y;A|X) 估计强烈建议改用
# 患者级 GroupKFold(5 折) 合并，以保统计功效，避免型 VI 假阳性。
evaluation:
  cross_validation: group_kfold_recommended   # 推荐 5 折患者级 CV（待实现）
  fairness_metrics: [overall_auc, per_group_auc, worst_group_auc, auc_gap, eqodd]
  group_by: [sex, age_group, joint]
